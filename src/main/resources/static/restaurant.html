<!DOCTYPE html>
<html>
<head>
<title>Restaurant Details</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
background-image:url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8cmVzdGF1cmFudHxlbnwwfHwwfHx8MA%3D%3D&auto=format&fit=crop&w=800&q=60');
background-size:cover;
background-position:center;
}

.container{
max-width:800px;
max-height: 800px;
margin:auto;
background:white;
padding:20px;
margin-top:40px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
text-align:center;
}

img{
width:100%;
height:400px;
object-fit:cover;
border-radius:10px; 


}

.rating{
color:#ff9800;
font-weight:bold;
}

.desc{
color:gray;
margin:15px 0;
}

button{
padding:12px 25px;
background:#ff4d4d;
border:none;
color:white;
border-radius:5px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h2 id="name"></h2>

<p class="rating">⭐ 4.5 Rating</p>

<p class="desc">
Enjoy amazing food and reserve your table instantly.
Experience delicious meals and a great dining atmosphere.
</p>

<button onclick="book()">Reserve Table</button>

</div>

<script>

let restaurant = localStorage.getItem("restaurant");

document.getElementById("name").innerText = restaurant;

document.getElementById("image").src =
"https://source.unsplash.com/900x400/?restaurant,"+restaurant;

function book(){

window.location.href="booking.html";

}

</script>

</body>
</html>
