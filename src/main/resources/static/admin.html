<!DOCTYPE html>
<html>

<head>

<title>Admin Panel</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
background-image:url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8cmVzdGF1cmFudHxlbnwwfHwwfHx8MA%3D%3D&auto=format&fit=crop&w=800&q=60');
background-size:cover;
background-position:center;
}

.container{
width: 500px;
margin:auto;
margin-top:80px;
background:gray;
padding:30px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

input{
width:100%;
padding:10px;
margin:10px 0;
}

button{
width:100%;
padding:10px;
background:#ff4d4d;
border:none;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h2>Add Restaurant</h2>

<input id="name" placeholder="Restaurant Name">

<input id="location" placeholder="Location">

<input id="image" placeholder="Image URL">

<input id="rating" placeholder="Rating">

<button onclick="addRestaurant()">Add Restaurant</button>

</div>

<script>

function addRestaurant(){

let data = {

name: document.getElementById("name").value,
location: document.getElementById("location").value,
image: document.getElementById("image").value,
rating: document.getElementById("rating").value

};

fetch("http://localhost:8081/api/restaurants", {

method: "POST",

headers: {
"Content-Type": "application/json"
},

body: JSON.stringify(data)

})

.then(response => response.json())

.then(data => {

alert("Restaurant Added Successfully!");

document.getElementById("name").value="";
document.getElementById("location").value="";
document.getElementById("image").value="";
document.getElementById("rating").value="";

});

}

</script>

</body>

</html>
