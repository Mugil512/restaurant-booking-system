<!DOCTYPE html>
<html>
<head>

<title>Foodie Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, Arial;
}

body{
background:#f5f5f5;
}

/* NAVBAR */

.navbar{
background:#ff4d4d;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 40px;
position:sticky;
top:0;
z-index:100;
}

.logo{
font-size:22px;
font-weight:bold;
}

.nav-links{
display:flex;
gap:25px;
list-style:none;
}

.nav-links a{
color:white;
text-decoration:none;
font-size:14px;
}

/* HERO */

.hero{
height:320px;
background:url("https://images.unsplash.com/photo-1504674900247-0877df9cc836");
background-size:cover;
background-position:center;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
text-align:center;
}

.hero h1{
font-size:40px;
margin-bottom:10px;
}

.hero p{
margin-bottom:20px;
}

.search-box input{
padding:12px;
width:320px;
border:none;
border-radius:6px;
outline:none;
}

/* SECTION */

.section-title{
font-size:24px;
margin:30px 40px;
}

/* GRID */

.restaurant-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
padding:0 40px 40px 40px;
}

/* CARD */

.card{
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 6px 18px rgba(0,0,0,0.1);
transition:0.3s;
display:flex;
flex-direction:column;
}

.card:hover{
transform:translateY(-6px);
box-shadow:0 12px 25px rgba(0,0,0,0.15);
}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

/* CARD CONTENT */

.card-content{
padding:15px;
flex:1;
display:flex;
flex-direction:column;
}

.card-content h3{
margin-bottom:5px;
}

.location{
color:gray;
font-size:14px;
margin-bottom:5px;
}

.rating{
color:#ff9800;
font-weight:bold;
margin-bottom:10px;
}

/* BUTTON */

.view-btn{
margin-top:auto;
padding:10px;
border:none;
background:#ff4d4d;
color:white;
border-radius:6px;
cursor:pointer;
font-size:14px;
}

.view-btn:hover{
background:#e63e3e;
}

/* MOBILE */

@media(max-width:768px){

.navbar{
flex-direction:column;
gap:10px;
}

.hero h1{
font-size:28px;
}

.search-box input{
width:90%;
}

.section-title{
margin-left:20px;
}

.restaurant-grid{
padding:0 20px 30px 20px;
}

}

</style>

</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

<div class="logo">🍽 Foodie</div>

<ul class="nav-links">

<li><a href="dashboard.html">Home</a></li>
<li><a href="bookings.html">My Bookings</a></li>
<li><a href="admin-dashboard.html">Admin Dashboard</a></li>
<li><a href="login.html">Logout</a></li>

</ul>

</div>

<!-- HERO -->

<div class="hero">

<h1>Discover the best food & drinks</h1>

<p>Book tables at your favourite restaurants</p>

<div class="search-box">

<input id="search" placeholder="Search restaurants..." onkeyup="searchRestaurant()">

</div>

</div>

<!-- SECTION TITLE -->

<h2 class="section-title">Popular Restaurants</h2>

<!-- RESTAURANT GRID -->

<div class="restaurant-grid" id="restaurants"></div>

<script>

/* OPEN RESTAURANT */

function openRestaurant(name){

localStorage.setItem("restaurant",name);
window.location.href="restaurant.html";

}

/* SEARCH */

function searchRestaurant(){

let input=document.getElementById("search").value.toLowerCase();

let cards=document.querySelectorAll(".card");

cards.forEach(card=>{

let title=card.querySelector("h3").innerText.toLowerCase();

if(title.includes(input)){
card.style.display="flex";
}else{
card.style.display="none";
}

});

}

/* LOAD RESTAURANTS */

fetch("http://localhost:8081/api/restaurants")

.then(res=>res.json())

.then(data=>{

let container=document.getElementById("restaurants");

container.innerHTML="";

data.forEach(r=>{

container.innerHTML+=`

<div class="card">

<img src="${r.image}" alt="${r.name}">

<div class="card-content">

<h3>${r.name}</h3>

<p class="location">📍 ${r.location}</p>

<p class="rating">⭐ ${r.rating}</p>

<button class="view-btn" onclick="openRestaurant('${r.name}')">
View Restaurant
</button>

</div>

</div>

`;

});

});

</script>

</body>
</html>
