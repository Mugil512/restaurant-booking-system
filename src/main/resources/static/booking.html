<!DOCTYPE html>
<html>
<head>
<title>Book Table</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, Arial;
}

body{
background:#f8f8f8;
background-image:url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8cmVzdGF1cmFudHxlbnwwfHwwfHx8MA%3D%3D&auto=format&fit=crop&w=800&q=60');
background-size:cover;
background-position:center;

}

/* NAVBAR */

.navbar{
background:#ff4d4d;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 30px;
}

.logo{
font-size:20px;
font-weight:bold;
}

.nav-links{
list-style:none;
display:flex;
gap:25px;
}

.nav-links a{
color:white;
text-decoration:none;
font-size:14px;
}

.nav-links a:hover{
text-decoration:underline;
}

/* BOOKING CONTAINER */

.container{
display:flex;
justify-content:center;
align-items:center;
height:85vh;
padding:20px;
}

/* CARD */

.booking-card{
background:white;
padding:35px;
border-radius:10px;
width:380px;
box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.booking-card h2{
text-align:center;
margin-bottom:20px;
}

/* RESTAURANT NAME */

.restaurant{
background:#fff4f4;
padding:10px;
border-radius:5px;
margin-bottom:15px;
font-weight:bold;
text-align:center;
color:#ff4d4d;
}

/* INPUT */

input{
width:100%;
padding:12px;
margin:8px 0;
border-radius:6px;
border:1px solid #ddd;
font-size:14px;
}

/* BUTTON */

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:6px;
background:#ff4d4d;
color:white;
font-size:15px;
cursor:pointer;
}

button:hover{
background:#e60023;
}

/* MOBILE */

@media(max-width:768px){

.navbar{
flex-direction:column;
gap:8px;
}

.booking-card{
width:100%;
}

}

.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
display:none;
justify-content:center;
align-items:center;
}

.popup-box{
background:white;
padding:30px;
border-radius:10px;
text-align:center;
width:300px;
animation:pop 0.3s ease;
}

@keyframes pop{
from{transform:scale(0.7);}
to{transform:scale(1);}
}

</style>

</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

<div class="logo">🍽 Foodie</div>

<ul class="nav-links">

<li><a href="dashboard.html">Home</a></li>
<li><a href="bookings.html">My Bookings</a></li>
<li><a href="login.html">Logout</a></li>

</ul>

</div>


<!-- BOOKING FORM -->

<div class="container">

<div class="booking-card">

<h2>Book Your Table</h2>

<div class="restaurant" id="restaurantName"></div>

<input id="name" placeholder="Customer Name">

<input id="phone" placeholder="Phone Number">

<input id="people" type="number" placeholder="Number of People">

<input id="date" type="date">

<input id="time" type="time">

<button onclick="book()">Confirm Booking</button>

</div>

</div>

<div id="popup" class="popup">
<div class="popup-box">

<h2>🎉 Booking Confirmed</h2>

<p>Your table has been reserved successfully.</p>

<button onclick="goBookings()">View My Bookings</button>

</div>
</div>

<script>

/* SHOW RESTAURANT NAME */

let restaurant = localStorage.getItem("restaurant");

document.getElementById("restaurantName").innerText = restaurant;


/* BOOK TABLE */

function book(){

let data = {

customerName:document.getElementById("name").value,
phone:document.getElementById("phone").value,
numberOfPeople:document.getElementById("people").value,
restaurantName:restaurant,
bookingDate:document.getElementById("date").value,
bookingTime:document.getElementById("time").value

};

fetch("http://localhost:8081/api/bookings",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(data)

})

.then(response=>{

if(response.ok){

document.getElementById("popup").style.display="flex";

window.location.href="bookings.html";

}else{

alert("Booking failed!");

}

})

.catch(error=>{

alert("Server not responding");

console.log(error);

});

}

function goBookings(){
window.location.href="bookings.html";
}

</script>

</body>
</html>
